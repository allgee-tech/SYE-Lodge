# Production stack for a single VM (Oracle Cloud Always Free, Hetzner, any VPS).
#
#   cp .env.example .env      # fill in DB_PASSWORD, JWT_SECRET, APP_URL, SITE_ADDRESS
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports. PostgreSQL and the Spring Boot app stay on the
# private Docker network.

name: sye_lodge

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sye_lodge
      POSTGRES_USER: sye_lodge_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - sye-lodge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sye_lodge_app -d sye_lodge"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/sye_lodge
      DB_USERNAME: sye_lodge_app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      DEMO_DATA: ${DEMO_DATA:-false}
      MAIL_MODE: ${MAIL_MODE:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-SYE Lodge <no-reply@sye-lodge.local>}"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # The demo seeder renders photos; cap the heap to fit the VM.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Djava.awt.headless=true -Xms128m -Xmx768m}
    volumes:
      - sye-lodge-uploads:/app/uploads
      - sye-lodge-logs:/app/logs
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sye-lodge-db:
  sye-lodge-uploads:
  sye-lodge-logs:
  caddy-data:
  caddy-config:
