# Render Blueprint for SYE Lodge.
#
# One-click deploy:
#   https://render.com/deploy?repo=https://github.com/La-Pulga-001/SYE Lodge
#
# Creates one free Docker web service and one free Render Postgres database in
# Frankfurt (the closest Render region to Ghana). Free-plan limits, the 30-day
# database expiry and the Neon migration path are documented in docs/RENDER.md.
#
# Render's Postgres "connectionString" is a postgresql:// URL, which the JDBC
# driver cannot use directly, so the discrete host/port/database/user/password
# fields are wired in instead.

databases:
  - name: sye-lodge-db
    databaseName: sye_lodge
    user: sye_lodge_app
    plan: free
    region: frankfurt
    # 17 is the newest version Flyway supports without a compatibility warning.
    postgresMajorVersion: "17"

services:
  - type: web
    name: sye_lodge
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/universities
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # The application assembles the JDBC URL from these values.
      - key: DB_HOST
        fromDatabase:
          name: sye-lodge-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sye-lodge-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sye-lodge-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sye-lodge-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sye-lodge-db
          property: password

      # Render generates a long random signing secret on first apply and keeps
      # it stable across deploys, so sessions survive.
      - key: JWT_SECRET
        generateValue: true

      # Seed the demo accounts, 18 sample listings and student-board posts.
      # Demo data is disabled by default for safer deployments; see docs/RENDER.md to enable it.
      - key: DEMO_DATA
        value: "false"

      # Free web services cannot send outbound SMTP (ports 25/465/587 are
      # blocked). Console mode is the safe default until a HTTPS provider is
      # configured. To deliver real email, set MAIL_MODE=resend and add the
      # secret RESEND_API_KEY plus a verified MAIL_FROM in Render.
      - key: MAIL_MODE
        value: console

      # The free instance has 512 MB RAM and 0.1 CPU. Cap the heap so the JVM
      # stays inside the container, use the low-overhead serial collector, and
      # skip C2 JIT compilation to speed up cold starts.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k -Djava.awt.headless=true"

      # APP_URL is intentionally unset: the production profile falls back to
      # RENDER_EXTERNAL_URL, so links use the correct https:// address.
      # Uncomment this after attaching a custom domain:
      # - key: APP_URL
      #   value: https://sye_lodge.example.com
