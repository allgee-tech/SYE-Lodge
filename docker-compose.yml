services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sye_lodge
      POSTGRES_USER: sye_lodge_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sye-lodge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sye_lodge_app -d sye_lodge"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/sye_lodge
      DB_USERNAME: sye_lodge_app
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:8080}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - sye-lodge-uploads:/app/uploads
      - sye-lodge-logs:/app/logs

volumes:
  sye-lodge-db:
  sye-lodge-uploads:
  sye-lodge-logs:
